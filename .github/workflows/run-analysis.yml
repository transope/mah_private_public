name: Private-Public dataset analysis

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:                       # also runs automatically when you upload new data files
    paths:
      - "data/**"

permissions:
  contents: write             # lets the workflow save the output folder back into the repo

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the analysis script
        run: python private_public_dataset.py

      - name: Make results downloadable from the run page
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Save results into the repo (output folder)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Analysis output $(date -u +%Y-%m-%d)"
          git push
